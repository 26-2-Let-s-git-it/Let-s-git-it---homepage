<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholar Map | Write Review</title>
  </head>

  <body>
    <!-- 공통 Header -->
    <div id="site-header"></div>

    <main class="review-write">
      <!-- 페이지 제목 -->
      <h1 id="review-write-title">Writing Review</h1>

      <!-- 리뷰 작성 및 수정 폼 -->
      <form id="review-write-form" class="review-write-form">
        <!-- 상단 DONE 버튼 -->
        <div class="review-write__actions">
          <button type="submit" id="review-submit-button">DONE</button>
        </div>

        <hr class="review-write__divider" />

        <!-- 리뷰 제목 -->
        <div class="review-write__field">
          <label for="review-title">
            <span class="required-mark" aria-hidden="true">*</span>
            Title
          </label>

          <div class="review-write__input-group">
            <input
              type="text"
              id="review-title"
              name="title"
              aria-describedby="review-title-error"
              required
            />

            <p id="review-title-error" class="review-write__error" hidden>Please enter title</p>
          </div>
        </div>

        <!-- 장학금 이름 선택 -->
        <div class="review-write__field">
          <label for="review-scholarship">
            <span class="required-mark" aria-hidden="true">*</span>
            Scholar name
          </label>

          <div class="review-write__input-group">
            <select
              id="review-scholarship"
              name="scholarshipId"
              aria-describedby="review-scholarship-error"
              required
            >
              <option value="" disabled selected>SELECT</option>

              <!-- JS에서 장학금 목록 동적 생성 -->
            </select>

            <p id="review-scholarship-error" class="review-write__error" hidden>
              Please enter scholar name
            </p>
          </div>
        </div>

        <!-- 지원 일시 (년, 월 선택) -->
        <div class="review-write__field">
          <label for="review-application-date">
            <span class="required-mark" aria-hidden="true">*</span>
            Application Date
          </label>

          <div class="review-write__input-group">
            <input
              type="month"
              id="review-application-date"
              name="applicationDate"
              aria-describedby="review-application-date-error"
              required
            />

            <p id="review-application-date-error" class="review-write__error" hidden>
              Please enter application date
            </p>
          </div>
        </div>

        <!-- 지원 요건 -->
        <div class="review-write__field">
          <label for="review-qualification">
            <span class="required-mark" aria-hidden="true">*</span>
            Qualification
          </label>

          <div class="review-write__input-group">
            <input
              type="text"
              id="review-qualification"
              name="qualification"
              placeholder="e.g., Excellent grades, Single-parent family"
              aria-describedby="review-qualification-error"
              required
            />

            <p id="review-qualification-error" class="review-write__error" hidden>
              Please enter qualification
            </p>
          </div>
        </div>

        <!-- 장학금액 (숫자만 입력) -->
        <div class="review-write__field">
          <label for="review-amount">
            <span class="required-mark" aria-hidden="true">*</span>
            Scholar Amount
          </label>

          <div class="review-write__input-group">
            <input
              type="text"
              id="review-amount"
              name="amount"
              inputmode="numeric"
              pattern="[0-9]+"
              placeholder="Enter only number"
              aria-describedby="review-amount-error"
              required
            />

            <p id="review-amount-error" class="review-write__error" hidden>
              Please enter scholar amount
            </p>
          </div>
        </div>

        <!-- 리뷰 본문 -->
        <div class="review-write__field review-write__field--content">
          <label for="review-content">
            <span class="required-mark" aria-hidden="true">*</span>
            Review
          </label>

          <div class="review-write__input-group">
            <textarea
              id="review-content"
              name="content"
              rows="12"
              aria-describedby="review-content-error"
              required
            ></textarea>

            <p id="review-content-error" class="review-write__error" hidden>Please enter review</p>
          </div>
        </div>
      </form>
    </main>

    <!-- 공통 Header 동적 렌더링 -->
    <script type="module" src="/src/common/common.js"></script>
  </body>
</html>
