<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Let's git it</title>
    <link rel="stylesheet" href="layout.css" />
  </head>

  <body>
    <!-- 공통 Header -->
    <div id="site-header"></div>

    <main class="scholarship-home">
      <!-- 장학금 키워드 검색 -->
      <section class="scholarship-search" aria-labelledby="search-title">
        <h1 id="search-title">Search Scholarship</h1>

        <form id="scholarship-search-form" role="search">
          <label for="scholarship-keyword"> Search scholarships </label>

          <input
            type="search"
            id="scholarship-keyword"
            name="keyword"
            placeholder="Enter the keyword"
          />

          <button type="submit" aria-label="Search scholarships">
            <span aria-hidden="true">⌕</span>
          </button>
        </form>
      </section>

      <!-- 장학금 필터 영역 -->
      <section class="scholarship-filters" aria-label="Scholarship filters">
        <form id="scholarship-filter-form">
          <div class="filter-grid">
            <!-- 운영 기관 -->
            <fieldset class="filter-group">
              <legend>Operator</legend>

              <label><input type="checkbox" name="operator" value="national" /> National</label>
              <label><input type="checkbox" name="operator" value="local" /> Local</label>
              <label
                ><input type="checkbox" name="operator" value="corporation" /> Corporation</label
              >
              <label><input type="checkbox" name="operator" value="university" /> University</label>
              <label><input type="checkbox" name="operator" value="foundation" /> Foundation</label>
            </fieldset>

            <!-- 학년 -->
            <fieldset class="filter-group">
              <legend>Grade</legend>

              <label><input type="checkbox" name="grade" value="freshman" /> Freshman</label>
              <label><input type="checkbox" name="grade" value="sophomore" /> Sophomore</label>
              <label><input type="checkbox" name="grade" value="junior" /> Junior</label>
              <label><input type="checkbox" name="grade" value="senior" /> Senior</label>
            </fieldset>

            <!-- 장학금 유형 -->
            <fieldset class="filter-group">
              <legend>Category / Type</legend>

              <label
                ><input type="checkbox" name="category" value="academic" /> Academic
                Excellence</label
              >
              <label
                ><input type="checkbox" name="category" value="local-talent" /> Local Talent</label
              >
              <label
                ><input type="checkbox" name="category" value="income-linked" />
                Income-Linked</label
              >
              <label
                ><input type="checkbox" name="category" value="special-skills" /> Special
                Skills</label
              >
            </fieldset>

            <!-- 장학금액 -->
            <fieldset class="filter-group">
              <legend>Amount</legend>

              <label><input type="checkbox" name="amount" value="500000" /> ~ 500,000</label>
              <label><input type="checkbox" name="amount" value="1000000" /> ~ 1,000,000</label>
              <label><input type="checkbox" name="amount" value="3000000" /> ~ 3,000,000</label>
              <label
                ><input type="checkbox" name="amount" value="3000001-plus" /> 3,000,001 ~</label
              >
            </fieldset>

            <!-- 모집 상태 -->
            <fieldset class="filter-group">
              <legend>State</legend>

              <label><input type="checkbox" name="state" value="open" /> In progress</label>
              <label><input type="checkbox" name="state" value="closed" /> End</label>
            </fieldset>

            <!-- 추가 키워드 필터 -->
            <div class="filter-group filter-group--keyword">
              <label for="filter-keyword">Filtering</label>

              <input
                type="search"
                id="filter-keyword"
                name="filterKeyword"
                placeholder="Enter the word to filter"
              />

              <!-- JS에서 선택된 필터 태그 표시 -->
              <ul id="active-filters" aria-label="Applied filters"></ul>
            </div>
          </div>

          <div class="filter-actions">
            <button type="submit" id="apply-filter">APPLY</button>
          </div>
        </form>
      </section>

      <!-- 장학금 검색 결과 -->
      <section class="scholarship-results" aria-labelledby="results-title">
        <h2 id="results-title">Scholarship Results</h2>

        <!-- 검색 결과가 없을 때 표시 -->
        <p id="scholarship-empty-message" role="status" hidden>No search results exist!</p>

        <!-- 장학금 카드 목록 -->
        <div id="scholarship-list" class="scholarship-grid">
          <!-- 예시 장학금 카드 -->
          <article class="scholarship-card">
            <header class="scholarship-card__header">
              <div class="scholarship-card__heading">
                <h3>Scholar name</h3>
                <p>Organization Name</p>
              </div>

              <button
                type="button"
                class="scholarship-card__bookmark"
                aria-label="Save scholarship"
                aria-pressed="false"
              >
                ☆
              </button>
            </header>

            <dl class="scholarship-card__details">
              <div class="scholarship-card__item">
                <dt>Qualification</dt>
                <dd>EWHA STUDENT</dd>
              </div>

              <div class="scholarship-card__item">
                <dt>Number of selections</dt>
                <dd>1,500</dd>
              </div>

              <div class="scholarship-card__item">
                <dt>Support amount</dt>
                <dd>₩3,000,000</dd>
              </div>

              <div class="scholarship-card__item">
                <dt>Deadline</dt>
                <dd>D-3</dd>
              </div>
            </dl>

            <a href="/src/pages/scholarship/detail.html" class="scholarship-card__detail-link">
              SEE MORE
            </a>
          </article>

          <!-- 이후 JS에서 장학금 카드 추가 렌더링 -->
        </div>
      </section>
    </main>

    <!-- 공통 Header 동적 렌더링 -->
    <script type="module" src="/src/common/common.js"></script>

    <!-- 장학금 목록 및 검색 기능 -->
    <script type="module" src="/src/pages/scholarship/scholarship.js"></script>
  </body>
</html>
